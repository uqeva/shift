# shift-landing (story 21.21; AD-28): the public page's one server.
#
# Replaces the base image's `conf.d/default.conf`; the image's own
# `nginx.conf` (pid and temp paths in /tmp, `include conf.d/*.conf`) stays.
#
# HEADERS. `/etc/nginx/shift/security-headers.conf` holds every security
# header, `always`. nginx gives a location with any `add_header` of its own
# NONE of the server's, so every location includes the file itself, and the
# server block includes it for the answers nginx makes before choosing a
# location. The only other header set here is `Cache-Control`.
#
# CACHE. `/assets/*` is content-hashed by the build: a year, immutable, on a
# success only (no `always`: a 404 is never cached as immutable). Everything
# else (the page, the icons, the 404 page) is `no-cache`: revalidated on every
# use, so a deploy is seen at once.
#
# NO FALLBACK. This is not the SPA: an unknown path is the 404 page with status
# 404, never `index.html` with 200. `/404.html` itself is internal, so it is
# only ever served as a 404.
#
# IPv4 only: a container without IPv6 cannot bind `[::]`, and Traefik reaches
# this container on Docker's network. The page has no query string to redact;
# the default access log is kept.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    autoindex off;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css image/svg+xml text/plain;

    error_page 404 /404.html;

    # Responses nginx makes before choosing a location (a malformed request).
    include /etc/nginx/shift/security-headers.conf;

    location = / {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # A directory is never listed and never answers 403: the 404 page.
    location ~ /$ {
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        return 404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/shift/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
