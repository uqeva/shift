# shift-landing (story 21.21; AD-28): every security header, on every answer.
#
# `always`, so the 404 page, a 405 and the 400 nginx makes before choosing a
# location carry them too. nginx gives a location with any `add_header` of its
# own NONE of the server's, so the server block AND every location include
# this file (default.conf). Nothing else in the image sets a security header.
#
# The page has no script, no inline style and no origin but its own: the
# policy allows its stylesheet, its fonts and its icons, and nothing else.
# HSTS pins THIS host only: no includeSubDomains and no preload. On the apex,
# includeSubDomains would pin every subdomain to HTTPS for a year, which is the
# founder's later decision, not this image's. test/landing.test.ts pins each
# line, and
# scripts/ci/probe-landing-image.sh checks each one, exactly once, on every
# answer.
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), browsing-topics=()" always;
