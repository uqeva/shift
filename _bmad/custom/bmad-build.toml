# Team overrides for bmad-build (committed).
# Epic 4 retro, action item 5 (process lesson L1): specs silently narrowed or
# deferred epic acceptance criteria inside approved frozen blocks, and review
# compared code to the spec, never the spec to the epic.

[workflow]

persistent_facts = [
  "EPIC AC DEVIATIONS. When the intent is an epic story, or a fix tied to an epic's acceptance criteria, the spec's <frozen-after-approval> block must end with a `## Epic AC Deviations` section, so the human approves it with the intent. List every epic AC the spec defers, narrows or reinterprets. For each one, quote the epic AC, give the spec's choice and say why. If there are none, write the single line `None.`. Every DEFERRED epic AC also gets a `deferred-work.md` entry, written during planning (step 02), not left for review.",
  # Epic 10 retro, action A13 (P2, P3; epic 8-9 retro item 8 / epic-9-retro-item-23).
  "SPINE AMENDMENTS ARE TASKS. A spec that amends an architecture decision (AD-x), or cites an AD amendment as its justification, carries an Execution task that edits `_bmad-output/planning-artifacts/architecture/architecture-shift-2026-09-02/ARCHITECTURE-SPINE.md` in the same change, adding an `Amended <date> (<story>)` clause to that AD. Citing an amendment that no task writes is a defect.",
  "DEFERRALS ADDRESSED TO A STORY ARE ITS INPUTS. A `deferred-work.md` entry that says \"decide in story X\" (or \"X should …\", or names X as where it lands) is copied into X's spec as a required input, listed in the spec (Boundaries or Design Notes) with its answer. Story X cannot reach `done` while such an entry is unanswered: either the spec answers it, or the human records a new owner in the entry.",
  # Epic 15 retro A4 (item 32): CI is the e2e gate when port 5173 is taken.
  "LOCAL E2E HAS A STOP RULE. Never start a second Vite on another port to run e2e locally. If port 5173 is held by another checkout or session, do not run local e2e at all: CI is the e2e gate. If a local e2e run fails twice on the same test for an environmental reason (port, shared stack, timing), stop and leave it to CI instead of looping.",
  # Epic 15 retro A5 (item 33) / epic 11 retro A4 (item 39).
  "HOT FILES ARE SEQUENTIAL. Stories that touch the hot files (`apps/web/src/index.css`, `apps/web/src/components/ui/*`, `chrome.tsx`, `test/theme-contrast.test.ts`, the structural pin tests, `hr.json`) never run in parallel from one baseline. Start the next such story from the previous one's merge, and say so in the spec's baseline line.",
  # Epic 11 retro A3 (item 38).
  "A COLOUR TOKEN'S CONTRAST SPEC LISTS EVERY SURFACE. A spec that adds or moves a colour token lists every surface the token is drawn on or against, glass surfaces (Dialog, Popover, Sheet, the chrome) included, with each one's measured ratio. Each one is pinned in `test/theme-contrast.test.ts`, a known shortfall is pinned exactly, and none may be found only in review.",
  # Epic 12 retro A4 (P1): the 12.1 subagent committed schema to the shared stack.
  "STRICT DATABASE RULE. The local Supabase stack is shared by parallel sessions and is never changed by a story. Never apply a migration to it in any form (`supabase migration up`, `db reset`, `psql`, or SQL run inside a test), never patch a test harness (`test/database.ts`, `e2e/utils/*`) to apply one, and never run a DB-connecting root test file (`rls-isolation`, `concurrent-writes`, `provisioning`, `demo-organization`, …) against it: some commit in `afterAll`, so a \"rolled-back\" apply is committed, unrecorded in `schema_migrations`. Read-only queries only. DB tests for a new migration are verified in CI, on its fresh stack; a local failure caused by the unapplied migration is expected and is said so in the spec's Verification.",
  # Epic 12 retro A5 (P2): #280 failed 21 e2e tests on foreign keys from the cleanup.
  "A NEW TABLE WITH FOREIGN KEYS EXTENDS THE E2E CLEANUP. A story whose migration adds a table that references existing rows (`members`, `teams`, `roster_overrides`, …) extends `e2e/utils/database-helper.ts` in the same change, so every cleanup that deletes those rows first deletes the new table's rows (and their outbox rows by subject), in foreign-key order, in the same transaction.",
  # Epic 12 retro A5 (P2): #278 failed on a 12.2 e2e step that still expected the old surface.
  "A CHANGE TO WHAT A SURFACE SHOWS GREPS E2E FOR THE OLD BEHAVIOUR. A story that changes what a surface shows or offers (a control replaced by a notice, a label or route changed) searches `e2e/` for the old text, role or route and updates every spec that asserts it, in the same change, so one stale step does not hold a shared e2e lock and time out unrelated specs.",
  "DB-FREE ROOT TESTS RUN LOCALLY. The root test files that open no database connection (`test/resource-hygiene.test.ts`, which pins every `hr.json` key and every use of a sanctioned word, and `test/supabase-scaffold.test.ts`) are run locally by the implementation and by every review fix, before the commit: `pnpm exec vitest run test/resource-hygiene.test.ts test/supabase-scaffold.test.ts`. The STRICT DATABASE RULE still forbids every DB-connecting root file. A story whose migration changes an RPC's arity or a returned column set greps the DB-connecting tests that pin them (`test/provisioning.test.ts`: `argumentCount`, `TABLE(...)` signatures) and updates them in the same change, unrun, so CI does not find them first (epic 13 retro A10).",
  "A COLUMN ADDED TO A ROW GREPS EVERY MAPPER. A story that adds a column to a row the web app reads in more than one place (a leave record or request: id, dates, type, draws, half) greps every service and mapper that selects or copies that row's fields (`select(` column lists, `…Of(row)` parsers, offline snapshot readers, notification and export builders) and lists each one in the spec's Code Map, as changed or as deliberately left. One the spec does not list is a defect (epic 13 retro A11).",
  "RESOLVED DEFERRALS ARE MARKED IN THE SAME CHANGE. A story that resolves a `deferred-work.md` entry, wholly or in part, prefixes that entry with `RESOLVED by <story> (<date>) — `, or for a part `RESOLVED in part (<which part>) by <story> (<date>) — ` naming what stays open, in the same change that resolves it.",
  # Epic 14 retro A10 (P1): only rasterizing the PDF found the 14.3 overflow.
  "A GENERATED FILE IS OPENED, NOT ONLY ITS DEFINITION. A story that generates a file (PDF, xlsx, any export) produces one real file from a realistic fixture (long unbroken words, the longest names, many rows, a page break) and opens it: a PDF is rasterized (`pdftoppm`, or `uv run --with pymupdf` where poppler is missing) and the page images are looked at; a workbook is opened and its cells read back. The spec's Verification names the file and what was seen. Asserting the document definition alone is not verification.",
  # Epic 14 retro A11 (P2): status ran ahead of verification.
  "DONE MEANS MERGED WITH GREEN CI. A story's sprint status reaches `done` only after its PR has merged with the `CI passed` check green. Until then it stays `review`, with a note `built, CI pending` (and the PR number once there is one). The spec's residual-risk lines are rewritten when a later review or CI run settles them.",
  # Epic 18 retro A7 (R4, V1): four merged specs still said their tests "have never run".
  "A STORY SET DONE GETS ITS SPEC REWRITTEN IN THE SAME CHANGE. The change that sets a story to `done` after its merge (usually the next story's) also rewrites that story's spec: its `Status:` line names the PR and the squash, and every residual-risk line about tests not yet run says what CI showed, from `gh pr view <n> --json statusCheckRollup` and `gh run view --log-failed`. Name each failed run and its cause, each fix pushed only for CI (by commit), and the green run. A risk CI did not settle stays, and says so. A merged spec whose lines still say a test has never run is a defect. The epic's LAST story has no next story: the retrospective, or the status chore that sets it `done`, rewrites its spec in that same change (epic 16 retro A6).",
  # Epic 18 retro A7 (V1, P2): 18.4's archive scene was built after `actAs`, and only CI found it.
  "DB-TEST SCENES ARE BUILT AS THE OWNER, BEFORE `actAs`. A DB-connecting test written unrun builds every fixture or scene that writes `auth.users`, or bypasses a policy (`lendingScene`, `addThrowawayMember`, an owner insert naming `created_by`), while the connection is still the owner: before the case's first `actAs`, or after an explicit switch back (`actAsOwner`). Never build one between `actAs` and the write under test. Each expected code and message is read from the migration's own `raise` or constraint, not reasoned from a neighbour's.",
  # Epic 17 retro A6 (I1): a `pkill -f` during 17.2 stopped the manual-test stack's edge runtime.
  "NEVER SIGNAL PROCESSES BY PATTERN. In a local or worktree session (a CI runner's own steps in `.github/workflows/` are exempt), never run `pkill -f`, `killall`, `pgrep … | xargs kill` or any other kill by name or pattern. The host's PID namespace holds the manual-test stack's containers and other sessions' processes. Stop only a process this session started itself, by the PID it recorded when it started it. A process you did not start is left alone, even if it holds a port you need: then the check moves to CI.",
  # Epic 17 retro A6 (V3): 17.3's `private.reminder_late/2` was missing from the provisioning inventories; only CI found it.
  "A NEW DATABASE FUNCTION JOINS BOTH PROVISIONING INVENTORIES. A migration that adds ANY function in `public` or `private` (a trigger function, a predicate, a helper, not only an RPC) lists it, in the same change, in `test/provisioning.test.ts`'s `grantees` inventory (its expected grantees, or none) and, when it is `SECURITY INVOKER`, in the invoker inventory (`runs $name as the caller, with an empty search_path`), with its argument count and schema. The Unrun DB Test Auditor checks every `create function` in the diff's migrations against both lists.",
  # Epic 16 retro A6 (b, V3): 16.4's DB job could not serve the new function, then 19.1's claimless sweep missed it; only CI found both.
  "A NEW EDGE FUNCTION IS WIRED INTO EVERY STACK-STARTING CI JOB AND THE CLAIMLESS SWEEP. A story that adds a function under `supabase/functions/`, or changes a function's `deno.json` import map, checks, in the same change, every CI job and composite action that starts the stack or builds the functions (grep `.github/` for `supabase start`, `start-supabase.sh`, `functions serve` and `deploy/functions/Dockerfile`; today `test`, `e2e`, `functions-image` and `.github/actions/deploy`): each builds every workspace package the function imports (its `deno.json` map, e.g. `pnpm --filter @shift/domain --filter @shift/ics build`) before `supabase start`, `functions serve` or `docker build`. A new function is also added to `test/claimless-account.test.ts`'s `CALLS`, so 19.1's claimless sweep calls it: that file already fails when `CALLS` differs from the directories under `supabase/functions/` (`EDGE_FUNCTIONS`), but it opens a database, so only CI runs it; the entry is written in the same change, unrun. The Unrun DB Test Auditor checks both.",
  # Epic 16 retro A6 (a, V1): 16.1 changed index.css and CI found 15 theme failures first.
  "CSS OR TOKEN CHANGES RUN THE THEME ROOT FILES LOCALLY. A story or review fix that changes `apps/web/src/index.css`, a theme token, or a print or forced-colours block runs the DB-free theme root files before the commit: `pnpm exec vitest run test/theme-tokens.test.ts test/theme-contrast.test.ts test/theme-fidelity.test.ts test/theme-applied.test.ts` (after `pnpm build`: `theme-applied` reads `apps/web/dist`), and the spec's Verification lists them with their result.",
  # Epic 17 retro A6 (I2): worktree subagents have no gitleaks; the repository is public.
  "GITLEAKS IS THE ORCHESTRATOR'S, BEFORE EVERY PUSH. The repository is public. Worktree subagents cannot run gitleaks, so the orchestrator scans each branch before its first push and before every later push, and records that it did (the branch, the commit scanned and the result) in its report or the spec's Verification. A subagent's \"ready to push\" is never read as \"scanned\". No absolute local path (a scratchpad under `/tmp/…`, a home directory) is written into a committed file: describe it instead.",
  # Epic 21 retro A3: layout.spec's hand-injected team rows lacked a new column twice and the parser refused the whole calendar read.
  "INJECTED E2E ROWS FOLLOW THE PARSER. A story that adds a column a web parser requires greps `e2e/`, `smoke/` and `perf/` for every hand-built row of that table (`page.route`/`fulfill` bodies, helpers such as `widenWithTeams`) and adds the column there in the same change.",
  # Epic 21 retro A4: 0079's policies read their own table (42P17 infinite recursion).
  "NO RLS POLICY READS ITS OWN TABLE. A check that needs other rows of the same table goes through a `private` SECURITY DEFINER helper with `set search_path = ''` that answers false unless the caller is an active admin of that organization, listed in the provisioning grantees inventory.",
  # Epic 21 retro A5: 0081 aliased a table as `old` inside a trigger function (42702 ambiguous).
  "PLPGSQL NAMES NO ALIAS `old` OR `new` AND NO VARIABLE AFTER A COLUMN. The scaffold guard in `test/supabase-scaffold.test.ts` checks this; keep it passing and widen it when a new pattern appears.",
  # Epic 21 retro A6: catalog inventories pinned in the wrong order or missed (concurrent-writes, provisioning, name-key, FK lists).
  "CATALOG INVENTORIES ARE WRITTEN IN THE CATALOG'S ORDER AND ALL UPDATED IN ONE CHANGE. Before pinning a list a root test reads from the catalog, read that test's query: `concurrent-writes` sorts trigger columns by name, provisioning lists keys and grants in its own order. A new table, column, trigger, check or function updates provisioning (RLS, AUDITED, grantees, column privileges, FKs), rls-isolation AUDITED_TABLES, concurrent-writes and name-key together.",
  # Epic 21 retro A7: StrictMode's effect replay closed 21.26's dialog in the dev server only.
  "STRICTMODE REPLAYS MOUNT EFFECTS. The e2e runs the dev server under `<StrictMode>`. A host that opens a dialog from an effect opens it on the commit after mount, after the opened component's own mount effects; an effect that resets state on mount must not be able to cancel an opening queued in the same commit.",
  # Epic 21 retro A8: #374 merged after #373 changed a signature; main stopped typechecking.
  "MERGE ONLY ON A GREEN RUN OF A BRANCH REBASED ON CURRENT MAIN. When another PR merged after a branch's last green run, the orchestrator rebases or re-runs CI before merging, even when GitHub reports no conflict.",
  # Epic 21 retro A9: the shared e2e organization's history passed the 2,000-row export limit.
  "E2E CASES READ ONLY THEIR OWN FIXTURE. A case that exports, counts or lists organization-wide data (history, hours, exports) narrows to its own team, member or date range, because the shared e2e organization grows with every run.",
  # Epic 21 retro A10 (and epic 19 A8 a): 14 merged stories still read `review`.
  "A STORY IS SET `done` RIGHT AFTER ITS PR MERGES GREEN. The next change the orchestrator ships (or a status chore) sets each merged-green story to `done` with its PR, squash and run, and rewrites its spec's Status line.",
]

[[workflow.review_layers]]
id = "epic-ac-auditor"
name = "Epic AC Auditor"
instruction = """
Launch a context-free subagent with this prompt:

You are an Epic AC Auditor. The content below is a diff that includes a spec file (`spec-*.md` under `_bmad-output/implementation-artifacts/`).
1. Find that spec in the diff. If it names no epic story, and no epic or retro its intent traces to, reply `Not an epic story.` and stop.
2. Otherwise open `{project-root}/_bmad-output/planning-artifacts/epics.md` and read the acceptance criteria of the story the spec implements.
3. Check every one of those epic ACs against the spec AND the code in the diff.
4. Report each epic AC that the result does not meet, or meets only partly. Mark whether the spec's `## Epic AC Deviations` section lists it. An unlisted deviation is a finding even if the code matches the spec.
5. Also report each listed DEFERRED AC that has no `deferred-work.md` entry.

Output a Markdown list. Each item gives: the epic AC (quoted briefly), met / partly / not met, whether it is listed, and the evidence from the diff.

CONTENT:
{diff_output}

Do not invoke any skill. Return only the review result.
"""

# Epic 18 retro A7 (V1, P2): an unrun DB test's scene order passed two reviews; only CI found it.
# Widened by epic 16 retro A6 (b) and epic 17 retro A6 (b): provisioning inventories and Edge Function wiring.
[[workflow.review_layers]]
id = "unrun-db-test-auditor"
name = "Unrun DB Test Auditor"
instruction = """
If the diff adds or changes a case in a DB-connecting root test (`test/rls-isolation.test.ts`, `test/provisioning.test.ts`, `test/concurrent-writes.test.ts`, `test/notify-boundary.test.ts`, `test/demo-organization.test.ts`, or any other root test that opens a database connection), adds a migration that creates or replaces a function, or adds an Edge Function under `supabase/functions/` or changes one's `deno.json`, launch a subagent with this prompt; otherwise reply `No DB test, migration function or Edge Function changed.` and stop.

You are an Unrun DB Test Auditor. These cases were written without being run: CI is their first run. Do not run them, and do not connect to any database. For each added or changed case, report:
1. Every fixture or scene helper that writes `auth.users`, or writes past a policy as the owner, called after the case's `actAs` (the request role) and before any switch back to the owner. Such a write fails as `authenticated`.
2. Every expected error code and message that does not match, word for word, a `raise`, constraint name or policy refusal in the migration the case exercises (`supabase/migrations/`). Quote both.
3. Every expected value the database would store differently (a trimmed or normalized text, a canonical range such as `[a,b)`, a default the session cannot set).
4. Any step whose order makes the case pass without exercising the rule (a refusal reached earlier, by another check).
5. Every function a migration in the diff creates (`create function` / `create or replace function` in `public` or `private`) that is missing from `test/provisioning.test.ts`'s `grantees` inventory, or, when it is `SECURITY INVOKER`, from the invoker inventory (`runs $name as the caller`), with the right argument count and schema (epic 17 retro A6).
6. For every Edge Function the diff adds, or whose `deno.json` import map it changes: each CI job or composite action under `.github/` that starts the stack or builds the functions (grep for `supabase start`, `start-supabase.sh`, `functions serve`, `deploy/functions/Dockerfile`) that does not build every workspace package the function's `deno.json` imports before `supabase start`, `functions serve` or `docker build`; and whether `test/claimless-account.test.ts`'s `CALLS` calls it (epic 16 retro A6).

Output a Markdown list: the case's title (or the function's name), the finding, the line in the diff, and the migration, workflow or test line it contradicts.

Diff:

{diff_output}
"""
